<div id="cookie-banner" class="cookie-banner" role="region" aria-label="Preferências de cookies">
  <p>Usamos cookies para melhorar sua experiência. Você pode aceitar ou recusar cookies opcionais.</p>
  <div class="cookie-actions">
    <button id="cookie-recusar" class="btn btn-ghost" type="button">Recusar</button>
    <button id="cookie-aceitar" class="btn btn-primary" type="button">Aceitar</button>
  </div>
</div>

<style>
.cookie-banner {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  background: var(--bg-panel, #0d1220);
  border-top: 1px solid var(--border-subtle, #1e2740);
  padding: 1rem 1.5rem;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  flex-wrap: wrap;
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.35);
}

.cookie-banner p {
  color: var(--text-secondary, #9aa4bd);
  font-size: 0.85rem;
  max-width: 60ch;
  margin: 0;
}

.cookie-actions {
  display: flex;
  gap: 1rem;
  flex-shrink: 0;
}

.cookie-actions button {
  padding: 0.55rem 1.2rem;
  cursor: pointer;
}

@media (max-width: 560px) {
  .cookie-banner {
    flex-direction: column;
    align-items: stretch;
    text-align: center;
  }

  .cookie-actions {
    justify-content: center;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const banner = document.getElementById('cookie-banner');
  const btnAceitar = document.getElementById('cookie-aceitar');
  const btnRecusar = document.getElementById('cookie-recusar');
  if (!banner || !btnAceitar || !btnRecusar) return;

  let consentimento = null;
  try {
    consentimento = localStorage.getItem('kfka_cookie_consent');
  } catch (error) {
    // O aviso continua utilizável se o navegador bloquear o armazenamento.
  }

  if (consentimento !== 'aceito' && consentimento !== 'recusado') {
    banner.style.display = 'flex';
  }

  const salvarEscolha = (escolha) => {
    try {
      localStorage.setItem('kfka_cookie_consent', escolha);
    } catch (error) {
      // A escolha vale durante esta visita, mesmo sem persistência.
    }
    banner.style.display = 'none';
  };

  btnAceitar.addEventListener('click', () => salvarEscolha('aceito'));
  btnRecusar.addEventListener('click', () => salvarEscolha('recusado'));
});
</script>
