<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notas e Faltas — KFKA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/background.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">[K]</span> KFKA</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">📊 Painel</a>
      <a href="notas-faltas.html" class="active">📝 Notas e Faltas</a>
      <a href="comunicacao.html">💬 Comunicação</a>
    </nav>
    <div class="sidebar-user">
      Logado como<br>
      <strong id="nome-usuario">Professor(a)</strong><br>
      <a href="index.html" style="color:var(--cyan);">Sair</a>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Notas e Faltas</h1>
        <p>Lance e revise o desempenho dos alunos por bimestre.</p>
      </div>
      <select id="filtro-turma" class="btn btn-ghost">
        <option value="todas">Todas as turmas</option>
        <option value="9º A">9º A</option>
        <option value="9º B">9º B</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Aluno</th>
            <th>Turma</th>
            <th>1º Bim</th>
            <th>2º Bim</th>
            <th>Faltas</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabela-notas"></tbody>
      </table>
    </div>
  </main>

</div>

<script src="js/dados-mock.js"></script>
<script src="js/notas-faltas.js"></script>

</body>
</html>
