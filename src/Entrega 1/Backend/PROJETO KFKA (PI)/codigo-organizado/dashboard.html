<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — KFKA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/background.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">[K]</span> KFKA</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="active">📊 Painel</a>
      <a href="notas-faltas.html">📝 Notas e Faltas</a>
      <a href="comunicacao.html">💬 Comunicação</a>
    </nav>
    <div class="sidebar-user">
      Logado como<br>
      <strong id="nome-usuario">Professor(a)</strong><br>
      <a href="index.html" style="color:var(--cyan);">Sair</a>
    </div>
  </aside>

  <main class="app-main">
    <div class="app-topbar">
      <div>
        <h1>Painel geral</h1>
        <p>Resumo das turmas e pendências do bimestre.</p>
      </div>
    </div>

    <section class="stats-row reveal" id="stats-row"></section>

    <div class="table-wrap reveal reveal-delay-1">
      <table>
        <thead>
          <tr>
            <th>Aluno</th>
            <th>Turma</th>
            <th>Faltas</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabela-alunos"></tbody>
      </table>
    </div>
  </main>

</div>

<script src="js/dados-mock.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
