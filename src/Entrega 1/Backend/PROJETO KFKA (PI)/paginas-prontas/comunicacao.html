<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comunicação — KFKA</title><style>
/* ==========================================================
   KFKA — style.css
   Estilos globais: reset, variáveis, tipografia, layout base
   ========================================================== */

:root {
  /* Cores */
  --bg-primary: #05070d;
  --bg-panel: #0d1220;
  --bg-panel-alt: #10182b;
  --border-subtle: #1e2740;

  --blue: #3b6fd6;
  --cyan: #22c9e0;
  --gradient-accent: linear-gradient(90deg, var(--blue), var(--cyan));

  --text-primary: #f2f4f8;
  --text-secondary: #9aa4bd;
  --text-muted: #5b647c;

  /* Tipografia */
  --font-base: 'Inter', -apple-system, 'Segoe UI', sans-serif;

  /* Espaçamento */
  --space-xs: 0.5rem;
  --space-sm: 1rem;
  --space-md: 1.5rem;
  --space-lg: 2.5rem;
  --space-xl: 4rem;

  /* Layout */
  --radius: 10px;
  --max-width: 1200px;
}

/* Reset */
* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-base);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
}

img { max-width: 100%; display: block; }

a { color: inherit; text-decoration: none; }

ul { list-style: none; }

button, input { font-family: inherit; }

/* Layout utilitário */
.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--space-md);
}

.text-gradient {
  background: var(--gradient-accent);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Cabeçalho / navegação */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-sm) 0;
  border-bottom: 1px solid var(--border-subtle);
}

.logo {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: 0.04em;
}

.logo-mark {
  color: var(--cyan);
  font-weight: 800;
}

.nav-links {
  display: flex;
  gap: var(--space-lg);
  font-size: 0.95rem;
  color: var(--text-secondary);
}

.nav-links a:hover { color: var(--text-primary); }

/* Botões */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.75rem 1.6rem;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-primary {
  background: var(--gradient-accent);
  color: #04101a;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(34, 201, 224, 0.25);
}

.btn-ghost {
  background: transparent;
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
}

.btn-ghost:hover { border-color: var(--cyan); }

.btn-block { width: 100%; }

/* Responsividade base */
@media (max-width: 768px) {
  .nav-links { display: none; }
  :root { --space-xl: 2.5rem; --space-lg: 1.75rem; }
}
/* ==========================================================
   KFKA — components.css
   Componentes reutilizáveis entre páginas
   ========================================================== */

/* Hero da Home */
.hero {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: var(--space-xl);
  align-items: center;
  padding: var(--space-xl) 0;
}

.hero h1 {
  font-size: clamp(2rem, 4vw, 2.8rem);
  line-height: 1.15;
  margin-bottom: var(--space-sm);
}

.hero p {
  color: var(--text-secondary);
  max-width: 40ch;
  margin-bottom: var(--space-md);
}

.hero-actions { display: flex; gap: var(--space-sm); }

.hero-badges {
  display: flex;
  gap: var(--space-md);
  margin-top: var(--space-lg);
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.hero-badges div { display: flex; align-items: center; gap: 0.4rem; }

/* Card de funcionalidade */
.feature-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
  padding: var(--space-xl) 0;
}

.feature-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: var(--space-md);
  text-align: center;
}

.feature-card .icon {
  width: 44px;
  height: 44px;
  margin: 0 auto var(--space-sm);
  border-radius: 50%;
  background: var(--gradient-accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #04101a;
}

.feature-card h3 { font-size: 1rem; margin-bottom: 0.3rem; }
.feature-card p { color: var(--text-secondary); font-size: 0.9rem; }

/* Faixa "como funciona" */
.flow-strip {
  background: var(--bg-panel);
  border-top: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  padding: var(--space-lg) 0;
  text-align: center;
}

.flow-steps {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: var(--space-sm);
  margin-top: var(--space-sm);
  font-weight: 600;
  flex-wrap: wrap;
}

.flow-steps span.sep { color: var(--cyan); }

/* Painel de login (usado em login.html) */
.auth-shell {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100vh;
}

.auth-side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: var(--space-xl);
}

.auth-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 16px;
  padding: var(--space-lg);
  width: 100%;
  max-width: 420px;
  margin: auto;
}

.field { margin-bottom: var(--space-md); }

.field label {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 0.4rem;
  color: var(--text-secondary);
}

.field .input-wrap {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: var(--bg-panel-alt);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
}

.field .input-wrap:focus-within { border-color: var(--cyan); }

.field input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  width: 100%;
  font-size: 0.95rem;
}

.field input::placeholder { color: var(--text-muted); }

.field-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
  margin-bottom: var(--space-md);
}

.error-msg {
  color: #f87171;
  font-size: 0.85rem;
  margin-top: -0.5rem;
  margin-bottom: var(--space-sm);
  min-height: 1.2em;
}

/* Rodapé */
.site-footer {
  border-top: 1px solid var(--border-subtle);
  padding: var(--space-lg) 0;
  color: var(--text-muted);
  font-size: 0.85rem;
  text-align: center;
}

/* Responsivo */
@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; text-align: left; }
  .feature-grid { grid-template-columns: 1fr 1fr; }
  .auth-shell { grid-template-columns: 1fr; }
  .auth-side:first-child { display: none; }
}

@media (max-width: 560px) {
  .feature-grid { grid-template-columns: 1fr; }
  .hero-badges { flex-direction: column; gap: var(--space-xs); }
}
/* ==========================================================
   KFKA — app.css
   Estilos das telas internas (dashboard, notas, comunicação)
   ========================================================== */

.app-shell {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

.sidebar {
  background: var(--bg-panel);
  border-right: 1px solid var(--border-subtle);
  padding: var(--space-md);
  display: flex;
  flex-direction: column;
}

.sidebar .logo { margin-bottom: var(--space-lg); }

.sidebar-nav { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }

.sidebar-nav a {
  padding: 0.65rem 0.8rem;
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 0.9rem;
}

.sidebar-nav a:hover { background: var(--bg-panel-alt); color: var(--text-primary); }

.sidebar-nav a.active {
  background: var(--bg-panel-alt);
  color: var(--text-primary);
  border-left: 3px solid var(--cyan);
}

.sidebar-user {
  border-top: 1px solid var(--border-subtle);
  padding-top: var(--space-sm);
  font-size: 0.85rem;
  color: var(--text-secondary);
}

.app-main { padding: var(--space-lg); }

.app-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: var(--space-lg);
}

.app-topbar h1 { font-size: 1.4rem; }
.app-topbar p { color: var(--text-secondary); font-size: 0.9rem; }

/* Cartões de resumo (dashboard) */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-md);
  margin-bottom: var(--space-lg);
}

.stat-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  padding: var(--space-md);
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.stat-card:hover {
  border-color: var(--cyan);
  transform: translateY(-2px);
}

.stat-card .value {
  font-size: 1.8rem;
  font-weight: 700;
}

.stat-card .label {
  color: var(--text-secondary);
  font-size: 0.85rem;
  margin-top: 0.2rem;
}

/* Tabela de notas/faltas */
.table-wrap {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  overflow-x: auto;
}

table { width: 100%; border-collapse: collapse; min-width: 640px; }

th, td {
  text-align: left;
  padding: 0.8rem 1rem;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.9rem;
}

th { color: var(--text-secondary); font-weight: 600; font-size: 0.8rem; }

tr:last-child td { border-bottom: none; }

.badge {
  display: inline-block;
  padding: 0.25rem 0.7rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
}

.badge-ok { background: rgba(34, 201, 224, 0.15); color: var(--cyan); }
.badge-pending { background: rgba(248, 113, 113, 0.15); color: #f87171; }

/* Comunicação */
.chat-shell {
  display: grid;
  grid-template-columns: 320px 1fr;
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius);
  min-height: 480px;
  overflow: hidden;
}

.chat-list { border-right: 1px solid var(--border-subtle); }

.chat-item {
  padding: var(--space-sm) var(--space-md);
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
}

.chat-item:hover { background: var(--bg-panel-alt); }
.chat-item.active { background: var(--bg-panel-alt); border-left: 3px solid var(--cyan); }

.chat-item .nome { font-weight: 600; font-size: 0.9rem; }
.chat-item .preview {
  color: var(--text-secondary);
  font-size: 0.82rem;
  margin-top: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chat-window {
  display: flex;
  flex-direction: column;
  padding: var(--space-md);
}

.chat-window .msg {
  background: var(--bg-panel-alt);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  margin-bottom: var(--space-sm);
  max-width: 70%;
  font-size: 0.9rem;
}

.chat-window .msg.mine {
  margin-left: auto;
  background: var(--gradient-accent);
  color: #04101a;
}

/* Responsivo */
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .stats-row { grid-template-columns: 1fr; }
  .chat-shell { grid-template-columns: 1fr; }
  .chat-list { display: none; }
}
/* ==========================================================
   KFKA — background.css
   Glow de fundo, corte diagonal, textura e animações
   ========================================================== */

/* Camada de fundo fixa: glow azul inferior-esquerdo + corte
   diagonal ciano no canto superior-direito, como no protótipo */
body {
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  bottom: -25vw;
  left: -15vw;
  width: 70vw;
  height: 70vw;
  max-width: 900px;
  max-height: 900px;
  background: radial-gradient(circle, rgba(59, 111, 214, 0.35) 0%, rgba(34, 201, 224, 0.12) 45%, transparent 70%);
  filter: blur(10px);
  pointer-events: none;
  z-index: 0;
  animation: glow-pulse 8s ease-in-out infinite;
}

body::after {
  content: "";
  position: fixed;
  top: 0;
  right: 0;
  width: 260px;
  height: 260px;
  pointer-events: none;
  z-index: 0;
  background:
    linear-gradient(135deg, transparent 49.3%, rgba(34, 201, 224, 0.55) 49.3%, rgba(34, 201, 224, 0.55) 50%, transparent 50.2%);
  opacity: 0.6;
}

/* Todo conteúdo real fica acima da camada de fundo */
.site-header, main, footer, .app-shell, .auth-shell {
  position: relative;
  z-index: 1;
}

@keyframes glow-pulse {
  0%, 100% { opacity: 0.75; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

/* Textura de pontos, usada em seções escuras (ex: faixa "como funciona") */
.dot-texture {
  background-image: radial-gradient(rgba(154, 164, 189, 0.18) 1px, transparent 1px);
  background-size: 16px 16px;
}

/* Animação de entrada — um único momento orquestrado ao carregar a página */
@keyframes fade-in-up {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.reveal {
  animation: fade-in-up 0.7s ease-out both;
}

.reveal-delay-1 { animation-delay: 0.12s; }
.reveal-delay-2 { animation-delay: 0.24s; }
.reveal-delay-3 { animation-delay: 0.36s; }

@media (prefers-reduced-motion: reduce) {
  .reveal, .reveal-delay-1, .reveal-delay-2, .reveal-delay-3 { animation: none; }
  body::before { animation: none; }
}

</style>
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">[K]</span> KFKA</div>

</div>

<script>
// dados-mock.js — base de dados simulada (sem back-end real)

const alunos = [
  {
    id: 1,
    nome: "Ana Silva",
    turma: "9º A",
    notas: { "1º Bim": 8.5, "2º Bim": 7.0, "3º Bim": null, "4º Bim": null },
    faltas: 2,
    status: "Validado"
  },
  {
    id: 2,
    nome: "Bruno Lima",
    turma: "9º A",
    notas: { "1º Bim": 6.0, "2º Bim": 9.0, "3º Bim": null, "4º Bim": null },
    faltas: 5,
    status: "Pendente"
  },
  {
    id: 3,
    nome: "Carla Souza",
    turma: "9º B",
    notas: { "1º Bim": 7.5, "2º Bim": 8.0, "3º Bim": null, "4º Bim": null },
    faltas: 0,
    status: "Validado"
  },
  {
    id: 4,
    nome: "Diego Alves",
    turma: "9º B",
    notas: { "1º Bim": 5.5, "2º Bim": 6.5, "3º Bim": null, "4º Bim": null },
    faltas: 8,
    status: "Pendente"
  },
  {
    id: 5,
    nome: "Elisa Prado",
    turma: "9º A",
    notas: { "1º Bim": 9.0, "2º Bim": 9.5, "3º Bim": null, "4º Bim": null },
    faltas: 1,
    status: "Validado"
  }
];

const mensagens = [
  {
    id: 1,
    contato: "Responsável — Ana Silva",
    ultimaMensagem: "Obrigada pelo retorno sobre a prova de matemática!",
    hora: "09:42",
    naoLida: false
  },
  {
    id: 2,
    contato: "Responsável — Bruno Lima",
    ultimaMensagem: "Ele vai poder repor a atividade essa semana?",
    hora: "08:15",
    naoLida: true
  },
  {
    id: 3,
    contato: "Coordenação Pedagógica",
    ultimaMensagem: "As notas do 2º bimestre já podem ser validadas.",
    hora: "Ontem",
    naoLida: true
  },
  {
    id: 4,
    contato: "Responsável — Diego Alves",
    ultimaMensagem: "Bom dia, gostaria de agendar uma conversa.",
    hora: "Ontem",
    naoLida: false
  }
];

// Resumo usado no Dashboard
function getResumoTurmas() {
  const totalAlunos = alunos.length;
  const pendentes = alunos.filter(a => a.status === "Pendente").length;
  const mediaFaltas = (alunos.reduce((s, a) => s + a.faltas, 0) / totalAlunos).toFixed(1);
  return { totalAlunos, pendentes, mediaFaltas };
}

</script>
<script>
// comunicacao.js — lista de conversas + janela de chat (simulado)

document.addEventListener('DOMContentLoaded', () => {
  const usuario = localStorage.getItem('kfka_usuario');
  if (usuario) document.getElementById('nome-usuario').textContent = usuario;

  const chatList = document.getElementById('chat-list');
  const chatWindow = document.getElementById('chat-window');

  function renderLista() {
    chatList.innerHTML = mensagens.map(m => `
      <div class="chat-item" data-id="${m.id}">
        <div class="nome">${m.contato} ${m.naoLida ? '🔵' : ''}</div>
        <div class="preview">${m.ultimaMensagem}</div>
      </div>
    `).join('');

    chatList.querySelectorAll('.chat-item').forEach(item => {
      item.addEventListener('click', () => {
        chatList.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        const id = Number(item.dataset.id);
        const contato = mensagens.find(m => m.id === id);
        contato.naoLida = false;
        abrirConversa(contato);
        renderLista();
      });
    });
  }

  function abrirConversa(contato) {
    chatWindow.innerHTML = `
      <div style="margin-bottom:var(--space-sm); font-weight:600;">${contato.contato}</div>
      <div class="msg">${contato.ultimaMensagem}</div>
      <div class="msg mine">Obrigado pelo contato, já vou verificar e retorno em breve.</div>
      <div style="margin-top:auto; display:flex; gap:0.5rem;">
        <input type="text" placeholder="Escreva uma mensagem..."
               style="flex:1; background:var(--bg-panel-alt); border:1px solid var(--border-subtle); border-radius:8px; padding:0.6rem 0.9rem; color:var(--text-primary);">
        <button class="btn btn-primary">Enviar</button>
      </div>
    `;
  }

  renderLista();
});

</script>
